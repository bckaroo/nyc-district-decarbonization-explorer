[project]
name = "nyc-decarbonization"
version = "0.1.0"
description = "NYC District Decarbonization Explorer — NYC building energy screening, LL84 observed + modeled annual demand"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
